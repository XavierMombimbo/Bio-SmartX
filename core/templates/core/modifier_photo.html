{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier la photo de profil | SmartX</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        
        .profile-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .avatar-container {
            transition: all 0.3s ease;
            position: relative;
        }
        
        .avatar-container:hover {
            transform: scale(1.05);
        }
        
        .file-input-label {
            transition: all 0.2s ease;
        }
        
        .file-input-label:hover {
            background-color: #f1f5f9;
        }
        
        .preview-image {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
    <div class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            <div class="profile-card bg-white p-8">
                <!-- En-tête -->
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 flex items-center">
                        <i data-feather="image" class="text-blue-600 mr-2"></i>
                        Photo de profil
                    </h2>
                    <a href="{% url 'profil' %}" class="text-sm text-gray-600 hover:text-blue-600 flex items-center">
                        <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i>
                        Retour
                    </a>
                </div>

                <!-- Photo actuelle -->
                <div class="text-center mb-8">
                    <div class="flex flex-col items-center">
                        <div class="avatar-container mb-4">
                            {% if user.photo %}
                                <img src="{{ user.photo.url }}" alt="Photo de profil actuelle" 
                                    class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg preview-image">
                            {% else %}
                                <div class="w-32 h-32 bg-gradient-to-br from-blue-500 to-blue-700 text-white flex items-center justify-center rounded-full text-5xl font-bold shadow-lg">
                                    {{ user.username|slice:":1"|upper }}
                                </div>
                            {% endif %}
                        </div>
                        <p class="text-sm text-gray-500">Photo actuelle</p>
                    </div>
                </div>

                <!-- Formulaire -->
                <form method="post" action="{% url 'modifier_photo' %}" enctype="multipart/form-data" class="space-y-6">
                    {% csrf_token %}
                    
                    <!-- Sélection de fichier -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Sélectionner une nouvelle photo
                        </label>
                        <label for="photo" class="file-input-label flex flex-col items-center justify-center w-full px-4 py-6 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-500">
                            <div class="flex flex-col items-center justify-center">
                                <i data-feather="upload" class="w-8 h-8 text-gray-400 mb-2"></i>
                                <p class="text-sm text-gray-600">
                                    <span class="font-semibold">Cliquez pour téléverser</span> ou glissez-déposez
                                </p>
                                <p class="text-xs text-gray-500 mt-1">
                                    PNG, JPG ou JPEG (max. 5MB)
                                </p>
                            </div>
                            <input id="photo" name="photo" type="file" accept="image/*" class="hidden" required>
                        </label>
                    </div>
                    
                    <!-- Aperçu de la nouvelle image -->
                    <div id="image-preview-container" class="hidden text-center">
                        <div class="flex flex-col items-center">
                            <img id="image-preview" class="w-32 h-32 rounded-full object-cover border-4 border-blue-100 shadow mb-2 preview-image">
                            <p class="text-sm text-gray-500">Nouvel aperçu</p>
                        </div>
                    </div>
                    
                    <!-- Bouton de soumission -->
                    <div class="pt-4">
                        <button type="submit" id="submit-btn"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                            <i data-feather="save" class="w-4 h-4 mr-2"></i>
                            Enregistrer les modifications
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Pied de page -->
    <footer class="text-center py-4 text-xs text-gray-500">
        <p>&copy; {% now "Y" %} Smart-X Congo. Tous droits réservés.</p>
    </footer>

    <script>
        feather.replace();
        
        // Aperçu de l'image sélectionnée
        document.getElementById('photo').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const previewContainer = document.getElementById('image-preview-container');
            const previewImage = document.getElementById('image-preview');
            const submitBtn = document.getElementById('submit-btn');
            
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    submitBtn.disabled = false;
                }
                
                reader.readAsDataURL(file);
            } else {
                previewContainer.classList.add('hidden');
                submitBtn.disabled = true;
            }
        });
        
        // Glisser-déposer
        const fileInputLabel = document.querySelector('.file-input-label');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            fileInputLabel.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight() {
            fileInputLabel.classList.add('border-blue-500', 'bg-blue-50');
        }
        
        function unhighlight() {
            fileInputLabel.classList.remove('border-blue-500', 'bg-blue-50');
        }
        
        fileInputLabel.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            const input = document.getElementById('photo');
            
            input.files = files;
            
            // Déclencher l'événement change manuellement
            const event = new Event('change');
            input.dispatchEvent(event);
        }
    </script>
</body>
</html>
