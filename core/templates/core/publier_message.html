{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Publier un message | SmartX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4 text-blue-700">Publier un message global</h2>
        <form method="POST">
            {% csrf_token %}
            <textarea name="contenu" rows="6" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring focus:border-blue-500" placeholder="Écris ton message ici..."></textarea>
            <div class="text-end mt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Publier</button>
            </div>
        </form>
        <div class="mt-6">
            <a href="{% url 'dashboard_admin' %}" class="text-sm text-gray-500 hover:underline">&larr; Retour au tableau de bord</a>
        </div>
    </div>
</body>
</html>
